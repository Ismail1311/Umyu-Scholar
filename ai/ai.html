<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMYU Scholar - AI Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ---------- GLOBAL RESET ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #1a7a3c;
            --primary-light: #2a9c4a;
            --primary-dark: #0f5a2a;
            --primary-bg: #e8f5e9;
            --bg-color: #f4f6f9;
            --white: #ffffff;
            --gray-light: #f8f9fa;
            --gray: #e9ecef;
            --text-dark: #1a1a1a;
            --text-muted: #6c757d;
            --border-color: #dee2e6;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --transition: all 0.3s ease;
        }

        body {
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .chat-container {
            width: 100%;
            max-width: 820px;
            height: 92vh;
            max-height: 800px;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ---------- HEADER ---------- */
        .chat-header {
            background: var(--primary-color);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 2px solid var(--primary-dark);
            flex-wrap: wrap;
            gap: 10px;
        }
        .chat-header .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .chat-header .header-left .icon-box {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--white);
        }
        .chat-header .header-left .title-group h1 {
            font-size: 19px;
            font-weight: 700;
            color: var(--white);
            letter-spacing: 0.3px;
        }
        .chat-header .header-left .title-group span {
            font-size: 12px;
            color: rgba(255,255,255,0.75);
            font-weight: 400;
            display: block;
            margin-top: -2px;
        }
        .chat-header .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-header .header-actions button {
            width: 38px;
            height: 38px;
            background: rgba(255,255,255,0.12);
            border: none;
            border-radius: 50%;
            color: var(--white);
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .chat-header .header-actions button:hover {
            background: rgba(255,255,255,0.25);
        }
        .chat-header .header-actions .close-btn:hover {
            transform: rotate(90deg);
        }

        /* ---------- HEADER MENU DROPDOWN ---------- */
        .header-menu-wrapper {
            position: relative;   /* ← FIX: anchor dropdown to the 3-dot button */
        }
        .header-menu-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.18);
            padding: 6px;
            min-width: 180px;
            z-index: 10000;
            animation: menuIn 0.2s ease;
        }
        .header-menu-dropdown.active {
            display: block;
        }
        @keyframes menuIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header-menu-dropdown button {
            width: 100%;
            padding: 12px 14px;
            background: none;
            border: none;
            border-radius: 8px;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dark);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
            height: auto;
        }
        .header-menu-dropdown button:hover {
            background: var(--gray-light);
        }
        .header-menu-dropdown button i {
            width: 20px;
            text-align: center;
            color: var(--primary-color);
            font-size: 16px;
        }
        .header-menu-dropdown .menu-divider {
            height: 1px;
            background: var(--gray);
            margin: 4px 6px;
        }
        .header-menu-dropdown .badge-count {
            margin-left: auto;
            background: var(--primary-color);
            color: var(--white);
            font-size: 11px;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 12px;
        }

        /* ---------- CHAT MESSAGES ---------- */
        .chat-messages {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: var(--gray-light);
            scroll-behavior: smooth;
            position: relative;
        }

        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--gray);
            border-radius: 10px;
        }
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: var(--border-color);
        }

        /* ---------- MESSAGE BUBBLES ---------- */
        .message {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            max-width: 85%;
            animation: messageIn 0.35s ease forwards;
            opacity: 0;
            transform: translateY(12px);
        }
        @keyframes messageIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .message .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .message .bubble {
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 15px;
            line-height: 1.65;
            word-wrap: break-word;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            position: relative;
        }
        .message .bubble p {
            margin-bottom: 6px;
        }
        .message .bubble p:last-child {
            margin-bottom: 0;
        }
        .message .bubble ul,
        .message .bubble ol {
            padding-left: 20px;
            margin: 6px 0;
        }
        .message .bubble li { margin-bottom: 3px; }
        .message .bubble strong { color: var(--primary-color); }

        /* AI Message */
        .message.ai { align-self: flex-start; }
        .message.ai .avatar {
            background: var(--primary-color);
            color: var(--white);
        }
        .message.ai .bubble {
            background: var(--white);
            color: var(--text-dark);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--gray);
        }

        /* Feedback buttons */
        .message.ai .feedback-buttons {
            display: none;
            margin-top: 8px;
            gap: 8px;
            align-items: center;
        }
        .message.ai:hover .feedback-buttons { display: flex; }
        .message.ai .feedback-buttons button {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }
        .message.ai .feedback-buttons button:hover { background: var(--gray); }
        .message.ai .feedback-buttons button.liked {
            color: #28a745;
            border-color: #28a745;
            background: #e8f5e9;
        }
        .message.ai .feedback-buttons button.disliked {
            color: #dc3545;
            border-color: #dc3545;
            background: #f8d7da;
        }
        .message.ai .feedback-buttons .feedback-divider {
            color: var(--border-color);
            font-size: 12px;
        }

        /* User Message */
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.user .avatar {
            background: var(--primary-light);
            color: var(--white);
        }
        .message.user .bubble {
            background: var(--primary-color);
            color: var(--white);
            border-bottom-right-radius: 4px;
        }
        .message.user .bubble strong { color: rgba(255,255,255,0.9); }

        /* ---------- TYPING CURSOR ---------- */
        .typing-cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--primary-color);
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* ---------- TYPING INDICATOR (Bottom) ---------- */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            align-items: center;
            gap: 12px;
            padding: 4px 0 8px 0;
            animation: messageIn 0.3s ease forwards;
        }
        .typing-indicator.show { display: flex; }
        .typing-indicator .avatar {
            width: 36px;
            height: 36px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 18px;
            flex-shrink: 0;
        }
        .typing-indicator .dots {
            display: flex;
            gap: 5px;
            background: var(--white);
            padding: 12px 18px;
            border-radius: 14px;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--gray);
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        .typing-indicator .dots span {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: dotPulse 1.2s infinite ease-in-out;
        }
        .typing-indicator .dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse {
            0%, 60%, 100% { transform: scale(0.6); opacity: 0.4; }
            30% { transform: scale(1); opacity: 1; }
        }

        /* ---------- ERROR BANNER ---------- */
        .error-banner {
            display: none;
            padding: 14px 18px;
            background: #f8d7da;
            color: #842029;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 8px;
            align-self: center;
            width: 100%;
            text-align: center;
            border: 1px solid #f5c2c7;
        }
        .error-banner.show { display: block; }
        .error-banner .retry-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 10px;
            transition: var(--transition);
        }
        .error-banner .retry-btn:hover { background: #b02a37; }

        /* ---------- INPUT AREA ---------- */
        .chat-input {
            padding: 12px 16px 16px 16px;
            background: var(--white);
            border-top: 1px solid var(--gray);
            display: flex;
            align-items: flex-end;
            gap: 10px;
            flex-shrink: 0;
        }
        .chat-input .menu-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px 4px 8px 0;
            transition: var(--transition);
            height: 44px;
            display: flex;
            align-items: center;
        }
        .chat-input .menu-btn:hover { color: var(--primary-color); }
        .chat-input .input-wrapper {
            flex: 1;
            background: var(--gray-light);
            border-radius: 50px;
            border: 2px solid transparent;
            transition: var(--transition);
            display: flex;
            align-items: center;
            padding: 2px;
        }
        .chat-input .input-wrapper:focus-within {
            border-color: var(--primary-color);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(26, 122, 60, 0.08);
        }
        .chat-input .input-wrapper textarea {
            flex: 1;
            border: none;
            outline: none;
            padding: 10px 16px;
            font-size: 15px;
            background: transparent;
            resize: none;
            font-family: inherit;
            line-height: 1.5;
            max-height: 120px;
            min-height: 20px;
            color: var(--text-dark);
        }
        .chat-input .input-wrapper textarea::placeholder { color: var(--text-muted); }
        .chat-input .input-wrapper textarea:disabled { opacity: 0.6; }

        .chat-input .send-btn {
            padding: 10px 20px;
            background: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            height: 48px;
            min-width: 48px;
            justify-content: center;
        }
        .chat-input .send-btn:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(26, 122, 60, 0.3);
        }
        .chat-input .send-btn:active { transform: scale(0.96); }
        .chat-input .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .chat-input .send-btn .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.25);
            border-top: 3px solid var(--white);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .chat-input .send-btn.loading .spinner { display: inline-block; }
        .chat-input .send-btn.loading .btn-text { display: none; }
        .chat-input .send-btn .btn-text i { margin-right: 4px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- FOOTER ---------- */
        .chat-footer {
            padding: 8px 20px 12px 20px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--gray);
            flex-shrink: 0;
            background: var(--white);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 16px;
        }
        .chat-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        .chat-footer a:hover { text-decoration: underline; }

        /* ---------- MENU MODAL (Quick Questions) ---------- */
        .menu-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .menu-modal-overlay.active { display: flex; }
        .menu-modal {
            background: var(--white);
            border-radius: var(--radius);
            padding: 24px 28px;
            max-width: 420px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            animation: popIn 0.3s ease;
        }
        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .menu-modal h3 {
            font-size: 18px;
            color: var(--text-dark);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .menu-modal h3 i { color: var(--primary-color); }
        .menu-modal .menu-item {
            display: block;
            width: 100%;
            padding: 12px 16px;
            background: var(--gray-light);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-dark);
        }
        .menu-modal .menu-item:hover {
            background: var(--primary-bg);
            border-color: var(--primary-color);
            transform: translateX(4px);
        }
        .menu-modal .close-modal-btn {
            width: 100%;
            padding: 10px;
            background: var(--gray);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 6px;
            transition: var(--transition);
        }
        .menu-modal .close-modal-btn:hover { background: var(--border-color); }

        /* ---------- HISTORY PANEL ---------- */
        .history-panel {
            position: fixed;
            top: 0;
            right: -420px;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: var(--white);
            box-shadow: -4px 0 30px rgba(0,0,0,0.15);
            z-index: 9998;
            transition: right 0.35s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .history-panel.open { right: 0; }
        .history-panel .history-header {
            padding: 20px 24px;
            background: var(--primary-color);
            color: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .history-panel .history-header h2 {
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .history-panel .history-header button {
            background: rgba(255,255,255,0.15);
            border: none;
            color: var(--white);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 8px;
            transition: var(--transition);
        }
        .history-panel .history-header button:hover { background: rgba(255,255,255,0.25); }
        .history-panel .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }
        .history-panel .history-list .history-item {
            padding: 14px 16px;
            border-radius: 10px;
            background: var(--gray-light);
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
            cursor: pointer;
            transition: var(--transition);
        }
        .history-panel .history-list .history-item:hover {
            background: var(--white);
            border-color: var(--primary-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .history-panel .history-list .history-item .h-title {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-dark);
        }
        .history-panel .history-list .history-item .h-date {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .history-panel .history-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .history-panel .history-empty i {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        .history-panel .history-actions {
            padding: 12px 20px;
            border-top: 1px solid var(--gray);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .history-panel .history-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }
        .history-panel .history-actions .clear-btn {
            background: #f8d7da;
            color: #842029;
        }
        .history-panel .history-actions .clear-btn:hover { background: #f1c0c5; }
        .history-panel .history-actions .close-panel-btn {
            background: var(--gray);
            color: var(--text-dark);
        }
        .history-panel .history-actions .close-panel-btn:hover { background: var(--border-color); }

        /* ---------- TOAST ---------- */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            pointer-events: none;
        }
        .toast {
            background: #28a745;
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.2);
            animation: toastIn 0.4s ease;
            pointer-events: auto;
            text-align: center;
            max-width: 90%;
        }
        .toast.error { background: #dc3545; }
        .toast.info { background: #0d6efd; }
        @keyframes toastIn {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast.hiding { animation: toastOut 0.3s ease forwards; }
        @keyframes toastOut {
            to { transform: translateY(30px); opacity: 0; }
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 768px) {
            body { padding: 0; }
            .chat-container {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
            .chat-header { padding: 12px 16px; }
            .chat-header .header-left .icon-box {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
            .chat-header .header-left .title-group h1 { font-size: 16px; }
            .chat-header .header-left .title-group span { font-size: 11px; }
            .chat-messages { padding: 14px 14px; }
            .message { max-width: 92%; }
            .message .bubble { font-size: 14px; padding: 12px 15px; }
            .chat-input { padding: 10px 12px 14px 12px; gap: 8px; }
            .chat-input .input-wrapper textarea { font-size: 14px; padding: 8px 12px; }
            .chat-input .send-btn {
                padding: 10px 14px;
                font-size: 18px;
                height: 44px;
                min-width: 44px;
                justify-content: center;
            }
            /* Only hide the "Send" label — keep the paper-plane icon visible */
            .chat-input .send-btn .btn-label { display: none; }
            .chat-input .menu-btn { font-size: 20px; padding: 6px 2px 6px 0; }
            .history-panel { max-width: 100%; right: -100%; }
            .history-panel.open { right: 0; }
            .menu-modal { padding: 20px; }
            .chat-footer { font-size: 11px; padding: 6px 14px 10px 14px; }
            .header-menu-dropdown {
                right: -8px;
                min-width: 160px;
            }
        }

        @media (max-width: 480px) {
            .chat-header .header-left .title-group span { display: none; }
            .message .bubble { font-size: 13px; padding: 10px 13px; }
            .message .avatar { width: 30px; height: 30px; font-size: 14px; }
            .typing-indicator .avatar { width: 30px; height: 30px; font-size: 14px; }
            .typing-indicator .dots { padding: 10px 14px; }
            .typing-indicator .dots span { width: 6px; height: 6px; }
            .toast { font-size: 13px; padding: 10px 18px; }
            .menu-modal .menu-item { font-size: 13px; padding: 10px 14px; }
        }
    </style>
</head>
<body>

    <!-- CHAT CONTAINER -->
    <div class="chat-container">

        <!-- HEADER -->
        <header class="chat-header">
            <div class="header-left">
                <div class="icon-box"><i class="fas fa-headset"></i></div>
                <div class="title-group">
                    <h1>AI Assistant</h1>
                    <span id="userStatus">Powered by UMYU Scholar</span>
                </div>
            </div>
            <div class="header-actions">
                <!-- Menu Dropdown (New Chat + History) -->
                <div class="header-menu-wrapper">
                    <button id="headerMenuBtn" title="Menu">
                        <i class="fas fa-ellipsis-vertical"></i>
                    </button>
                    <div class="header-menu-dropdown" id="headerMenuDropdown">
                        <button id="newChatBtn">
                            <i class="fas fa-plus-circle"></i>
                            <span>New Chat</span>
                        </button>
                        <div class="menu-divider"></div>
                        <button id="historyBtn">
                            <i class="fas fa-clock-rotate-left"></i>
                            <span>History</span>
                            <span class="badge-count" id="historyBadge" style="display:none;">0</span>
                        </button>
                    </div>
                </div>
                <button class="close-btn" id="closeChat" title="Close chat">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </header>

        <!-- CHAT MESSAGES -->
        <div class="chat-messages" id="chatMessages">

            <!-- Error Banner -->
            <div class="error-banner" id="errorBanner">
                <span id="errorText"></span>
                <button class="retry-btn" id="retryBtn">Try Again</button>
            </div>

            <!-- Typing Indicator (will be moved to bottom dynamically) -->
            <div class="typing-indicator" id="typingIndicator">
                <div class="avatar"><i class="fas fa-headset"></i></div>
                <div class="dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

        </div>

        <!-- INPUT AREA -->
        <div class="chat-input">
            <button class="menu-btn" id="menuBtn" title="Quick Questions">
                <i class="fas fa-bars"></i>
            </button>
            <div class="input-wrapper">
                <textarea id="chatInput" rows="1" placeholder="Ask me anything about UMYU Scholar..." maxlength="2000"></textarea>
            </div>
            <button class="send-btn" id="sendBtn">
                <span class="spinner"></span>
                <span class="btn-text"><i class="fas fa-paper-plane"></i> <span class="btn-label">Send</span></span>
            </button>
        </div>

        <!-- FOOTER -->
        <div class="chat-footer">
            <span id="footerTip">💡 Ask about UMYU Scholar or general academic questions.</span>
            <a href="/support.html">Back to Support</a>
        </div>

    </div>

    <!-- MENU MODAL (Quick Questions) -->
    <div class="menu-modal-overlay" id="menuModalOverlay">
        <div class="menu-modal">
            <h3><i class="fas fa-bolt"></i> Quick Questions</h3>
            <div id="menuItems"></div>
            <button class="close-modal-btn" id="closeMenuBtn">Close</button>
        </div>
    </div>

    <!-- HISTORY PANEL -->
    <div class="history-panel" id="historyPanel">
        <div class="history-header">
            <h2><i class="fas fa-clock-rotate-left"></i> Chat History</h2>
            <button id="closeHistoryBtn"><i class="fas fa-times"></i></button>
        </div>
        <div class="history-list" id="historyList">
            <div class="history-empty">
                <i class="fas fa-comment-slash"></i>
                <p>No chat history yet. Start a conversation!</p>
            </div>
        </div>
        <div class="history-actions">
            <button class="clear-btn" id="clearHistoryBtn">Clear All</button>
            <button class="close-panel-btn" id="closeHistoryPanelBtn">Close</button>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <script type="module">
        // ============================================================
        // IMPORTS
        // ============================================================
        import { AI_API_URL } from './config.js';
        import { 
            auth, db, 
            collection, addDoc, getDocs, query, orderBy, where, 
            deleteDoc, doc, getDoc, updateDoc, 
            serverTimestamp, onAuthStateChanged,
            arrayUnion, increment
        } from '../js/firebase-config.js';

        // ============================================================
        // DOM REFS
        // ============================================================
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const closeBtn = document.getElementById('closeChat');
        const typingIndicator = document.getElementById('typingIndicator');
        const errorBanner = document.getElementById('errorBanner');
        const errorText = document.getElementById('errorText');
        const retryBtn = document.getElementById('retryBtn');
        const menuBtn = document.getElementById('menuBtn');
        const menuModalOverlay = document.getElementById('menuModalOverlay');
        const menuItems = document.getElementById('menuItems');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const headerMenuBtn = document.getElementById('headerMenuBtn');
        const headerMenuDropdown = document.getElementById('headerMenuDropdown');
        const newChatBtn = document.getElementById('newChatBtn');
        const historyBtn = document.getElementById('historyBtn');
        const historyPanel = document.getElementById('historyPanel');
        const historyList = document.getElementById('historyList');
        const closeHistoryBtn = document.getElementById('closeHistoryBtn');
        const closeHistoryPanelBtn = document.getElementById('closeHistoryPanelBtn');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const historyBadge = document.getElementById('historyBadge');
        const toastContainer = document.getElementById('toastContainer');
        const footerTip = document.getElementById('footerTip');
        const userStatus = document.getElementById('userStatus');

        // ============================================================
        // STATE
        // ============================================================
        let isProcessing = false;
        let currentUser = null;
        let currentConversationId = null;
        let messageCount = 0;

        // ============================================================
        // FIREBASE AUTH
        // ============================================================
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                userStatus.textContent = `👤 ${user.displayName || user.email}`;
                loadConversations();
            } else {
                userStatus.textContent = 'Powered by UMYU Scholar';
                historyBadge.style.display = 'none';
                historyList.innerHTML = `
                    <div class="history-empty">
                        <i class="fas fa-lock"></i>
                        <p>Sign in to save your chat history.</p>
                    </div>
                `;
            }
        });

        // ============================================================
        // HEADER MENU (Dropdown)
        // ============================================================
        function openHeaderMenu() {
            headerMenuDropdown.classList.add('active');
        }
        function closeHeaderMenu() {
            headerMenuDropdown.classList.remove('active');
        }
        headerMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            headerMenuDropdown.classList.toggle('active');
        });
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.header-menu-wrapper')) {
                closeHeaderMenu();
            }
        });

        // ============================================================
        // NEW CHAT
        // ============================================================
        newChatBtn.addEventListener('click', () => {
            closeHeaderMenu();
            startNewChat();
        });

        function startNewChat() {
            // The previous conversation is already saved by saveConversation()
            // Just reset the local state and UI
            currentConversationId = null;
            messageCount = 0;
            
            // Clear messages area (keep error banner & typing indicator)
            const messages = chatMessages.querySelectorAll('.message');
            messages.forEach(m => m.remove());
            
            // NOTE: No greeting shown on "New Chat" — the chat area stays clean.
            scrollToBottom();
            chatInput.focus();
            
            showToast('✨ Started a new chat', 'success', 2500);
        }

        // ============================================================
        // SUGGESTIONS / MENU ITEMS
        // ============================================================
        const suggestions = [
            { label: '📤 How to upload a paper?', query: 'How do I upload a paper?' },
            { label: '🔑 Reset my password', query: 'How do I reset my password?' },
            { label: '📚 Find research papers', query: 'How can I find research papers?' },
            { label: '💻 Upload software', query: 'How do I upload software with my paper?' },
            { label: '📧 Contact support', query: 'How do I contact support?' },
            { label: '📋 What is UMYU Scholar?', query: 'What is UMYU Scholar?' },
            { label: '👤 Who can upload?', query: 'Who can upload papers?' },
            { label: '📥 Download papers', query: 'How do I download papers?' },
        ];

        function renderMenuItems() {
            menuItems.innerHTML = suggestions.map(s => 
                `<button class="menu-item" data-query="${s.query}">${s.label}</button>`
            ).join('');
            menuItems.querySelectorAll('.menu-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const query = btn.dataset.query;
                    chatInput.value = query;
                    chatInput.focus();
                    closeMenu();
                    sendMessage();
                });
            });
        }
        renderMenuItems();

        // ============================================================
        // QUICK QUESTIONS MENU MODAL
        // ============================================================
        function openMenu() {
            menuModalOverlay.classList.add('active');
        }
        function closeMenu() {
            menuModalOverlay.classList.remove('active');
        }
        menuBtn.addEventListener('click', openMenu);
        closeMenuBtn.addEventListener('click', closeMenu);
        menuModalOverlay.addEventListener('click', (e) => {
            if (e.target === menuModalOverlay) closeMenu();
        });

        // ============================================================
        // HISTORY PANEL
        // ============================================================
        function openHistory() {
            historyPanel.classList.add('open');
        }
        function closeHistory() {
            historyPanel.classList.remove('open');
        }
        historyBtn.addEventListener('click', () => {
            closeHeaderMenu();
            openHistory();
        });
        closeHistoryBtn.addEventListener('click', closeHistory);
        closeHistoryPanelBtn.addEventListener('click', closeHistory);

        // ============================================================
        // TOAST SYSTEM
        // ============================================================
        function showToast(message, type = 'success', duration = 3000) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hiding');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ============================================================
        // ADD MESSAGE TO CHAT
        // ============================================================
        function addMessage(text, sender = 'ai', messageId = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            if (messageId) msgDiv.dataset.messageId = messageId;

            const avatarIcon = sender === 'ai' ? 'fa-headset' : 'fa-user';
            let feedbackHTML = '';
            if (sender === 'ai') {
                feedbackHTML = `
                    <div class="feedback-buttons">
                        <button class="feedback-like" data-message-id="${messageId || 'temp'}"><i class="fas fa-thumbs-up"></i></button>
                        <span class="feedback-divider">|</span>
                        <button class="feedback-dislike" data-message-id="${messageId || 'temp'}"><i class="fas fa-thumbs-down"></i></button>
                    </div>
                `;
            }

            msgDiv.innerHTML = `
                <div class="avatar"><i class="fas ${avatarIcon}"></i></div>
                <div class="bubble">
                    <span class="bubble-text">${text}</span>
                    ${feedbackHTML}
                </div>
            `;

            chatMessages.appendChild(msgDiv);
            scrollToBottom();

            if (sender === 'ai') {
                const likeBtn = msgDiv.querySelector('.feedback-like');
                const dislikeBtn = msgDiv.querySelector('.feedback-dislike');
                if (likeBtn) {
                    likeBtn.addEventListener('click', () => handleFeedback(messageId || 'temp', 'like', likeBtn));
                }
                if (dislikeBtn) {
                    dislikeBtn.addEventListener('click', () => handleFeedback(messageId || 'temp', 'dislike', dislikeBtn));
                }
            }

            return msgDiv;
        }

        // ============================================================
        // TYPEWRITER EFFECT for AI messages
        // ============================================================
        async function addAIMessageWithTyping(rawText, formattedHTML, messageId) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai';
            if (messageId) msgDiv.dataset.messageId = messageId;

            // Build structure with EMPTY bubble-text
            msgDiv.innerHTML = `
                <div class="avatar"><i class="fas fa-headset"></i></div>
                <div class="bubble">
                    <span class="bubble-text"></span><span class="typing-cursor"></span>
                    <div class="feedback-buttons" style="display:none;">
                        <button class="feedback-like"><i class="fas fa-thumbs-up"></i></button>
                        <span class="feedback-divider">|</span>
                        <button class="feedback-dislike"><i class="fas fa-thumbs-down"></i></button>
                    </div>
                </div>
            `;

            chatMessages.appendChild(msgDiv);
            scrollToBottom();

            const bubbleText = msgDiv.querySelector('.bubble-text');
            const cursor = msgDiv.querySelector('.typing-cursor');

            // Type out plain text (strip HTML for the typing view)
            const plainText = rawText.replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');

            // Speed: 8ms per character (adjustable)
            const speed = 8;

            for (let i = 0; i < plainText.length; i++) {
                bubbleText.textContent += plainText.charAt(i);
                // Scroll every few characters for smoothness
                if (i % 5 === 0) scrollToBottom();
                await new Promise(r => setTimeout(r, speed));
            }

            // Once done typing, replace with the beautifully formatted HTML
            bubbleText.innerHTML = formattedHTML;
            cursor.remove();
            scrollToBottom();

            // Now show feedback buttons
            const feedbackBtns = msgDiv.querySelector('.feedback-buttons');
            feedbackBtns.style.display = 'flex';

            const likeBtn = msgDiv.querySelector('.feedback-like');
            const dislikeBtn = msgDiv.querySelector('.feedback-dislike');
            if (likeBtn) {
                likeBtn.addEventListener('click', () => handleFeedback(messageId || 'temp', 'like', likeBtn));
            }
            if (dislikeBtn) {
                dislikeBtn.addEventListener('click', () => handleFeedback(messageId || 'temp', 'dislike', dislikeBtn));
            }

            return msgDiv;
        }

        // ============================================================
        // FEEDBACK HANDLER
        // ============================================================
        async function handleFeedback(messageId, type, btn) {
            if (!currentUser) {
                showToast('Please sign in to provide feedback.', 'info', 3000);
                return;
            }
            try {
                await addDoc(collection(db, 'feedback'), {
                    messageId: messageId,
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    feedback: type,
                    timestamp: serverTimestamp()
                });
                const parent = btn.closest('.feedback-buttons');
                if (parent) {
                    const likeBtn = parent.querySelector('.feedback-like');
                    const dislikeBtn = parent.querySelector('.feedback-dislike');
                    if (type === 'like') {
                        likeBtn.classList.add('liked');
                        dislikeBtn.classList.remove('disliked');
                    } else {
                        dislikeBtn.classList.add('disliked');
                        likeBtn.classList.remove('liked');
                    }
                }
                showToast(`👍 Thanks for your feedback!`, 'success', 2500);
            } catch (error) {
                console.error('Feedback error:', error);
                showToast('Failed to save feedback. Please try again.', 'error', 3000);
            }
        }

        // ============================================================
        // AI GREETING
        // ============================================================
        function showGreeting() {
            const greeting = `
                <p>👋 <strong>Hello!</strong> I'm the UMYU Scholar AI Assistant.</p>
                <p>I can help you with:</p>
                <ul>
                    <li><strong>📤 Uploading papers</strong> — Step-by-step guidance</li>
                    <li><strong>🔍 Finding research</strong> — Browse and search tips</li>
                    <li><strong>🔑 Account issues</strong> — Login, reset password, verification</li>
                    <li><strong>📚 Academic questions</strong> — Research methodology, sampling, statistics</li>
                </ul>
                <p style="margin-top:6px;">What would you like to know? 😊</p>
            `;
            // Greeting appears instantly (no typing animation) for immediate welcome
            addMessage(greeting, 'ai', 'greeting');
        }
        // Only show greeting on first page load
        showGreeting();

        // ============================================================
        // SCROLL TO BOTTOM
        // ============================================================
        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ============================================================
        // TYPING INDICATOR — Appears at the BOTTOM
        // ============================================================
        function showTyping() {
            // Move typing indicator to the very bottom of the messages
            chatMessages.appendChild(typingIndicator);
            typingIndicator.classList.add('show');
            scrollToBottom();
        }
        function hideTyping() {
            typingIndicator.classList.remove('show');
        }

        // ============================================================
        // ERROR HANDLING
        // ============================================================
        function showError(message) {
            errorText.textContent = message || '😅 Oops! Something went wrong.';
            errorBanner.classList.add('show');
            scrollToBottom();
        }
        function hideError() {
            errorBanner.classList.remove('show');
        }

        // ============================================================
        // SEND MESSAGE
        // ============================================================
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message || isProcessing) return;

            chatInput.value = '';
            chatInput.style.height = 'auto';
            hideError();

            const userMessage = message
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            addMessage(userMessage, 'user');

            showTyping();

            isProcessing = true;
            chatInput.disabled = true;
            sendBtn.disabled = true;
            sendBtn.classList.add('loading');

            try {
                const response = await fetch(AI_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to get response.');
                }

                hideTyping();

                if (data.reply) {
                    // Save conversation BEFORE typing (in case user navigates away)
                    if (currentUser) {
                        // Fire and forget — don't block typing
                        saveConversation(message, data.reply).catch(err => console.error(err));
                    }

                    // Format the reply
                    const formattedReply = data.reply
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\n/g, '<br>');

                    const msgId = `ai_${Date.now()}`;
                    await addAIMessageWithTyping(data.reply, formattedReply, msgId);
                } else {
                    addMessage('I\'m sorry, I couldn\'t process that. Please try again.', 'ai', 'error');
                }

            } catch (error) {
                hideTyping();
                const friendlyError = `
                    😅 <strong>Oops!</strong> I'm having trouble reaching my brain right now.
                    <br><br>
                    This could be a temporary glitch. Please try again in a few moments.
                    <br><br>
                    If the issue persists, contact our support team at 
                    <a href="mailto:umyuscholar@gmail.com" style="color:var(--primary-color);">umyuscholar@gmail.com</a> 
                    or visit the <a href="/contact.html" style="color:var(--primary-color);">Contact page</a>.
                `;
                addMessage(friendlyError, 'ai', 'error');
                showError('Network error. Please check your connection.');
            } finally {
                isProcessing = false;
                chatInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.classList.remove('loading');
                chatInput.focus();
                scrollToBottom();
            }
        }

        // ============================================================
        // SAVE CONVERSATION TO FIRESTORE
        // ============================================================
        async function saveConversation(userMsg, aiMsg) {
            if (!currentUser) return;
            try {
                const convRef = collection(db, 'users', currentUser.uid, 'conversations');
                if (!currentConversationId) {
                    // Auto-generate title from the first user message
                    const title = generateTitle(userMsg);
                    const newConv = await addDoc(convRef, {
                        title: title,
                        messages: [
                            { role: 'user', content: userMsg, timestamp: serverTimestamp() },
                            { role: 'ai', content: aiMsg, timestamp: serverTimestamp() }
                        ],
                        createdAt: serverTimestamp(),
                        updatedAt: serverTimestamp(),
                        messageCount: 2
                    });
                    currentConversationId = newConv.id;
                    messageCount = 2;
                } else {
                    const convDoc = doc(db, 'users', currentUser.uid, 'conversations', currentConversationId);
                    await updateDoc(convDoc, {
                        messages: arrayUnion(
                            { role: 'user', content: userMsg, timestamp: serverTimestamp() },
                            { role: 'ai', content: aiMsg, timestamp: serverTimestamp() }
                        ),
                        updatedAt: serverTimestamp(),
                        messageCount: increment(2)
                    });
                    messageCount += 2;
                }
                loadConversations();
            } catch (error) {
                console.error('Error saving conversation:', error);
            }
        }

        // ============================================================
        // HELPER: Generate a smart title from the first user message
        // ============================================================
        function generateTitle(message) {
            // Strip HTML and common question words
            let cleaned = message
                .replace(/<[^>]*>/g, '')
                .replace(/\n/g, ' ')
                .trim();

            // Remove leading question words and articles
            const prefixes = [
                'how do i ', 'how can i ', 'how to ', 'what is ', 'what are ',
                'who can ', 'who is ', 'where is ', 'where can i ', 'when is ',
                'can i ', 'do i ', 'is there ', 'are there ', 'tell me about ',
                'explain ', 'describe ', 'show me ', 'give me ', 'help me ',
                'the ', 'a ', 'an '
            ];
            const lower = cleaned.toLowerCase();
            for (const prefix of prefixes) {
                if (lower.startsWith(prefix)) {
                    cleaned = cleaned.substring(prefix.length);
                    break;
                }
            }

            // Capitalize first letter
            cleaned = cleaned.charAt(0).toUpperCase() + cleaned.slice(1);

            // Truncate to 50 chars
            if (cleaned.length > 50) {
                cleaned = cleaned.substring(0, 50).trim() + '...';
            }

            return cleaned || 'New Conversation';
        }

        // ============================================================
        // LOAD CONVERSATIONS FROM FIRESTORE
        // ============================================================
        async function loadConversations() {
            if (!currentUser) return;
            try {
                const convRef = collection(db, 'users', currentUser.uid, 'conversations');
                const q = query(convRef, orderBy('updatedAt', 'desc'));
                const snapshot = await getDocs(q);
                const convs = [];
                snapshot.forEach(doc => {
                    convs.push({ id: doc.id, ...doc.data() });
                });
                renderHistory(convs);
                if (convs.length > 0) {
                    historyBadge.style.display = 'inline-block';
                    historyBadge.textContent = convs.length;
                } else {
                    historyBadge.style.display = 'none';
                }
            } catch (error) {
                console.error('Error loading conversations:', error);
            }
        }

        // ============================================================
        // RENDER HISTORY
        // ============================================================
        function renderHistory(convs) {
            if (!convs || convs.length === 0) {
                historyList.innerHTML = `
                    <div class="history-empty">
                        <i class="fas fa-comment-slash"></i>
                        <p>No chat history yet. Start a conversation!</p>
                    </div>
                `;
                return;
            }
            let html = '';
            convs.forEach(conv => {
                const date = conv.updatedAt?.toDate?.() || new Date();
                const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                html += `
                    <div class="history-item" data-id="${conv.id}">
                        <div class="h-title">${conv.title || 'Untitled'}</div>
                        <div class="h-date">${dateStr} at ${timeStr} • ${conv.messageCount || 0} messages</div>
                    </div>
                `;
            });
            historyList.innerHTML = html;
            historyList.querySelectorAll('.history-item').forEach(item => {
                item.addEventListener('click', () => {
                    const id = item.dataset.id;
                    loadConversation(id);
                    closeHistory();
                });
            });
        }

        // ============================================================
        // LOAD A SPECIFIC CONVERSATION
        // ============================================================
        async function loadConversation(convId) {
            if (!currentUser) return;
            try {
                const convRef = doc(db, 'users', currentUser.uid, 'conversations', convId);
                const docSnap = await getDoc(convRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    // Clear all messages from the chat area
                    chatMessages.querySelectorAll('.message').forEach(m => m.remove());

                    if (data.messages && data.messages.length > 0) {
                        data.messages.forEach(msg => {
                            const sender = msg.role === 'user' ? 'user' : 'ai';
                            const content = msg.content.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                            // Load instantly (no typing animation for history)
                            addMessage(content, sender);
                        });
                    } else {
                        showGreeting();
                    }
                    currentConversationId = convId;
                    messageCount = data.messageCount || 0;
                    scrollToBottom();
                }
            } catch (error) {
                console.error('Error loading conversation:', error);
            }
        }

        // ============================================================
        // CLEAR HISTORY
        // ============================================================
        clearHistoryBtn.addEventListener('click', async () => {
            if (!currentUser) return;
            if (!confirm('Are you sure you want to clear all chat history?')) return;
            try {
                const convRef = collection(db, 'users', currentUser.uid, 'conversations');
                const snapshot = await getDocs(convRef);
                const deletePromises = [];
                snapshot.forEach(doc => {
                    deletePromises.push(deleteDoc(doc.ref));
                });
                await Promise.all(deletePromises);
                showToast('✅ History cleared!', 'success', 3000);
                loadConversations();
                currentConversationId = null;
                messageCount = 0;
                chatMessages.querySelectorAll('.message').forEach(m => m.remove());
                showGreeting();
            } catch (error) {
                console.error('Error clearing history:', error);
                showToast('Failed to clear history.', 'error', 3000);
            }
        });

        // ============================================================
        // RETRY LAST MESSAGE
        // ============================================================
        retryBtn.addEventListener('click', () => {
            hideError();
            const userMessages = chatMessages.querySelectorAll('.message.user');
            if (userMessages.length > 0) {
                const lastUserMsg = userMessages[userMessages.length - 1];
                const text = lastUserMsg.querySelector('.bubble-text, .bubble').textContent;
                chatInput.value = text;
                sendMessage();
            } else {
                showError('No message to retry. Please type a new question.');
            }
        });

        // ============================================================
        // AUTO-RESIZE TEXTAREA
        // ============================================================
        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
        });

        // ============================================================
        // ENTER KEY SUPPORT (Shift+Enter for new line)
        // ============================================================
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        // ============================================================
        // CLOSE CHAT
        // ============================================================
        closeBtn.addEventListener('click', () => {
            window.history.back();
        });

        // ============================================================
        // FOCUS INPUT ON LOAD
        // ============================================================
        chatInput.focus();

        // ============================================================
        // UPDATE FOOTER TIP RANDOMLY
        // ============================================================
        const tips = [
            '💡 Ask about UMYU Scholar or general academic questions.',
            '💡 Try asking: "How do I upload a paper?"',
            '💡 Need help? I can explain step by step.',
            '💡 I can help with research methodology and statistics too.',
            '💡 Having trouble? Just ask and I\'ll guide you.',
        ];
        let tipIndex = 0;
        setInterval(() => {
            tipIndex = (tipIndex + 1) % tips.length;
            footerTip.textContent = tips[tipIndex];
        }, 8000);

        console.log('✅ UMYU Scholar AI Assistant loaded successfully!');
        console.log(`🔗 API URL: ${AI_API_URL}`);
    </script>
</body>
</html>
